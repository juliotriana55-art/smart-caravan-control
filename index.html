async function connect(){if(st.mode!=='vrm'){st.data=null;st.error='';render();return}if(st.busy)return;st.busy=true;st.error='';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const url=new URL(st.endpoint);if(url.protocol!=='https:'||url.username||url.password||url.search||url.hash)throw Error('HTTPS Worker URL required');if(!st.access)throw Error('APP_KEY required');url.pathname=url.pathname.replace(/\/$/,'')+'/telemetry';const res=await fetch(url.href,{headers:{'X-App-Key':st.access,'Accept':'application/json'},cache:'no-store',signal:controller.signal});const json=await res.json().catch(()=>null);if(!res.ok)throw Error('HTTP '+res.status);if(json?.source!=='vrm'||!json.data||typeof json.data!=='object')throw Error('Unexpected Worker response');const d={};for(const k of ['soc','voltage','current','solarWatts','dcPower','waterPct'])d[k]=typeof json.data[k]==='number'&&Number.isFinite(json.data[k])?json.data[k]:null;d.inverter=['on','off'].includes(json.data.inverter)?json.data.inverter:null;if(!Object.values(d).some(v=>v!==null))throw Error('No usable telemetry');st.data=d;st.last=Date.now();st.sourceTimestamp=typeof json.updated==='string'?json.updated:null;$('debug').textContent=JSON.stringify({status:'ok',updated:st.sourceTimestamp,fields:d},null,2)}catch(e){st.error=e.name==='AbortError'?'Timeout':String(e.message).slice(0,150);$('debug').textContent=JSON.stringify({status:'failed',reason:st.error},null,2)}finally{clearTimeout(timeout);st.busy=false;render()}}

let lastSpoken='';function speak(s){lastSpoken=s;if(!('speechSynthesis'in window)){$('voiceStatus').textContent=t('voiceFail');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang=st.speechLang;u.rate=.95;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase()&&/female|samantha|karen|ava|catherine|moira|serena/i.test(v.name))||vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||null;speechSynthesis.speak(u)}catch{$('voiceStatus').textContent=t('voiceFail')}}function fill(s,fields){return s.replace(/\{(\w+)\}/g,(_,k)=>String(fields[k]??'—'))}function answer(raw){readProfile();const q=String(raw).trim().toLowerCase(),lang=st.speechLang.slice(0,2),tt=k=>t(k,lang),d=st.mode==='demo'?{soc:84,voltage:12.8,solarWatts:245,inverter:'off',waterPct:65}:st.data||{},loc=/where|ubicaci[oó]n|d[oó]nde/.test(q);let out;if(loc&&/bater|battery/.test(q))out=st.batteryLoc?fill(tt('batteryLocAnswer'),{where:st.batteryLoc}):tt('locationAbsent');else if(loc&&/heater|calefactor|diesel/.test(q))out=st.heaterLoc?fill(tt('heaterLocAnswer'),{where:st.heaterLoc}):tt('locationAbsent');else if(/bater|battery|charge|carga/.test(q))out=Number.isFinite(d.soc)?fill(tt('batteryAnswer'),{soc:fmt(d.soc),voltage:fmt(d.voltage,2)}):tt('batteryAbsent');else if(/solar|panel/.test(q))out=Number.isFinite(d.solarWatts)?fill(tt('solarAnswer'),{watts:fmt(d.solarWatts)}):tt('solarAbsent');else if(/inverter|inversor/.test(q))out=d.inverter?fill(tt('inverterAnswer'),{state:tt(d.inverter)}):tt('inverterAbsent');else if(/water|agua|tank|tanque/.test(q))out=Number.isFinite(d.waterPct)?fill(tt('waterAnswer'),{pct:fmt(d.waterPct)}):tt('waterAbsent');else out=tt('unrecognised');if(st.mode==='demo')out=(lang==='es'?'Demostración: ':'Demo: ')+out;else if(st.data&&freshness()==='stale')out+=tt('oldWarning');else if(st.data&&freshness()==='unknown')out+=tt('unknownWarning');$('reply').textContent=st.name+': '+out;$('voiceStatus').textContent='';speak(out)}$('askBattery').onclick=()=>answer('battery');$('askSolar').onclick=()=>answer('solar');$('send').onclick=()=>{if($('typed').value.trim())answer($('typed').value);$('typed').value=''};$('typed').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('repeat').onclick=()=>{if(lastSpoken)speak(lastSpoken)};const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(Rec)$('listen').onclick=()=>{const r=new Rec();r.lang=st.speechLang;r.onstart=()=>{$('voiceStatus').textContent=t('listening');$('listen').disabled=true};r.onresult=e=>answer(e.results[0][0].transcript);r.onerror=e=>{$('voiceStatus').textContent=e.error};r.onend=()=>{$('listen').disabled=false};try{r.start()}catch(e){$('listen').disabled=false;$('voiceStatus').textContent=e.message}};else $('listen').onclick=()=>{$('voiceStatus').textContent=t('noSpeech')};
for(const id of fields)$(id).value=st[id];$('endpoint').value=st.endpoint;$('access').value=st.access;$('mode').value=st.mode;$('appLang').value=st.lang;$('speechLang').value=st.speechLang;$('reply').textContent=st.name+': '+t('ready');render();save();if(st.mode==='vrm'&&st.access)connect();setInterval(()=>{if(st.mode==='vrm'&&!document.hidden)connect();else render()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();if(st.mode==='vrm')connect()}});
</script></body></html>
