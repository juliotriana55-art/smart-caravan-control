const t=(key,lang=st.lang)=>dict[lang]?.[key]||dict.en[key]||key;const save=()=>{const {data,last,error,busy,speaking,...persistent}=st;localStorage.setItem(storageKey,JSON.stringify(persistent))};const fmt=(v,dec=0)=>Number.isFinite(v)?v.toLocaleString(st.lang==='es'?'es-ES':st.lang==='th'?'th-TH':'en-AU',{maximumFractionDigits:dec,minimumFractionDigits:dec}):'—';
function renderI18n(){document.documentElement.lang=st.lang==='en'?'en-AU':st.lang;for(const key of Object.keys(dict.en))if($(key))$(key).textContent=t(key);$('appLang').value=st.lang;$('mode').value=st.mode;$('speechLang').value=st.speechLang;renderData();renderTasks();}
function renderData(){const live=st.mode==='vrm'&&!!st.data;const d=live?st.data:st.mode==='demo'?{soc:84,voltage:12.8,current:-3.2,solarWatts:245,dcPower:null,inverter:'off',waterPct:65}:{};const val=x=>Number.isFinite(x);$('soc').textContent=val(d.soc)?fmt(d.soc,0)+'%':'—';$('socBar').style.width=val(d.soc)?Math.max(0,Math.min(100,d.soc))+'%':'0%';$('batteryDetail').textContent=val(d.voltage)?`${fmt(d.voltage,2)} V${val(d.current)?' · '+fmt(d.current,1)+' A':''}`:t('notAvailable');$('solar').textContent=val(d.solarWatts)?fmt(d.solarWatts)+' W':'—';$('power').textContent=val(d.dcPower)?fmt(d.dcPower)+' W':'—';$('inv').textContent=d.inverter==='on'?t('on'):d.inverter==='off'?t('off'):'—';$('water').textContent=val(d.waterPct)?fmt(d.waterPct)+'%':'—';for(const el of ['bSource','sSource','pSource','iSource'])$(el).textContent=st.mode==='demo'?'DEMO':live?'VRM':'—';for(const el of ['solarNote','powerNote','invNote','waterNote'])$(el).textContent=st.mode==='demo'?t('demoNote'):t('liveNote');$('lastUpdate').textContent=st.last?`${t('last')}: ${new Date(st.last).toLocaleTimeString()}`:'';const badge=$('badge'),banner=$('banner');badge.className='badge'+(live?' live':st.error?' error':'');badge.textContent='● '+(st.mode==='demo'?t('demo'):live?t('live'):st.error?t('connectionError'):t('waiting'));banner.className='banner'+(live?' live':'');banner.textContent=st.mode==='demo'?t('demoNote'):st.error?`${t('vrmFail')} (${st.error})`:live?t('liveNote'):t('waiting')}
function show(tab){document.querySelectorAll('.pane').forEach(e=>e.classList.toggle('hidden',e.id!==tab));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function readForms(){st.name=$('name').value.trim().slice(0,30)||'Charlie';st.speechLang=$('speechLang').value;st.brand=$('brand').value.trim();st.model=$('model').value.trim();st.batteryLoc=$('batteryLoc').value.trim();st.heaterLoc=$('heaterLoc').value.trim();st.panels=Math.max(0,Number($('panels').value)||0);st.batteryCount=Math.max(0,Number($('batteryCount').value)||0);save()}
function renderTasks(){const root=$('tasks');root.replaceChildren();if(!st.tasks.length){root.textContent=t('noTasks');return}for(const [idx,item] of st.tasks.entries()){const box=document.createElement('div');box.className='item';const title=document.createElement('div');title.textContent=(item.done?'✓ ':'')+item.text+(item.due?' · '+item.due:'');title.style.textDecoration=item.done?'line-through':'none';const controls=document.createElement('div');controls.className='row';const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=t('complete');toggle.onclick=()=>{st.tasks[idx].done=!st.tasks[idx].done;save();renderTasks()};const del=document.createElement('button');del.className='secondary';del.textContent=t('delete');del.onclick=()=>{st.tasks.splice(idx,1);save();renderTasks()};controls.append(toggle,del);box.append(title,controls);root.append(box)}}
async function connect(){if(st.mode!=='vrm'){st.data=null;st.error='';renderData();return}if(st.busy)return;st.busy=true;st.error='';renderData();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const base=new URL(st.endpoint);if(base.protocol!=='https:'||base.username||base.password)throw Error('HTTPS URL required');const url=new URL('/telemetry',base.origin);const res=await fetch(url,{headers:{'X-App-Key':st.access,'Accept':'application/json'},cache:'no-store',signal:controller.signal});const payload=await res.json().catch(()=>null);if(!res.ok)throw Error('HTTP '+res.status+(payload?.error?' · '+String(payload.error).slice(0,110):''));if(!payload||payload.source!=='vrm'||!payload.data)throw Error('Invalid telemetry response');const keys=['soc','voltage','current','solarWatts','dcPower','waterPct'];const clean={};for(const k of keys){const n=payload.data[k];clean[k]=(typeof n==='number'&&Number.isFinite(n))?n:null}clean.inverter=['on','off'].includes(payload.data.inverter)?payload.data.inverter:null;st.data=clean;st.last=Date.now();$('debug').textContent=JSON.stringify({status:'ok',updated:payload.updated||null,fields:clean,meta:payload.meta||null},null,2);}catch(err){st.data=null;st.error=err.name==='AbortError'?'Timeout':String(err.message).slice(0,180);$('debug').textContent=JSON.stringify({status:'failed',reason:st.error},null,2)}finally{clearTimeout(timeout);st.busy=false;renderData()}}
$('refresh').onclick=connect;$('testConnect').onclick=connect;$('saveConnect').onclick=()=>{const endpoint=$('endpoint').value.trim(),access=$('access').value.trim();st.mode=$('mode').value;st.endpoint=endpoint;st.access=access;st.data=null;st.last=0;st.error='';save();renderI18n();connect()};$('disconnect').onclick=()=>{st.mode='demo';st.data=null;st.last=0;st.error='';save();renderI18n()};$('appLang').onchange=e=>{st.lang=e.target.value;save();renderI18n()};$('speechLang').onchange=e=>{st.speechLang=e.target.value;save()};$('name').onchange=readForms;$('saveCaravan').onclick=()=>{readForms();$('caravanNote').textContent=t('saved')+' · '+t('caravanNote')};$('addTask').onclick=()=>{const value=$('task').value.trim();if(!value)return;st.tasks.push({text:value.slice(0,160),due:$('due').value,done:false});$('task').value='';$('due').value='';save();renderTasks()};
let lastSpoken='';function speak(text){lastSpoken=text;if(!('speechSynthesis'in window)){$('voiceStatus').textContent=t('voiceFail',st.speechLang.slice(0,2));return}try{speechSynthesis.cancel();const speech=new SpeechSynthesisUtterance(text);speech.lang=st.speechLang;speech.rate=.95;const voices=speechSynthesis.getVoices();speech.voice=voices.find(v=>v.lang.toLowerCase()===st.speechLang.toLowerCase()&&/female|samantha|karen|ava|catherine|moira|serena/i.test(v.name))||voices.find(v=>v.lang.toLowerCase()===st.speechLang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(st.speechLang.slice(0,2)))||null;speech.onerror=()=>{$('voiceStatus').textContent=t('voiceFail',st.speechLang.slice(0,2))};speechSynthesis.speak(speech)}catch{$('voiceStatus').textContent=t('voiceFail',st.speechLang.slice(0,2))}}function fill(pattern,fields){return pattern.replace(/\{(\w+)\}/g,(_,key)=>String(fields[key]??'—'))}
function answer(question){readForms();const q=String(question).trim().toLowerCase();const language=st.speechLang.slice(0,2);const tt=k=>t(k,language);const d=st.mode==='demo'?{soc:84,voltage:12.8,solarWatts:245,inverter:'off',waterPct:65}:st.data;let response;const loc=/where|ubicaci[oó]n|d[oó]nde|อยู่ที่ไหน|ตำแหน่ง/.test(q);if(loc&&/bater|battery|แบต/.test(q))response=st.batteryLoc?fill(tt('batteryLocAnswer'),{where:st.batteryLoc}):tt('locationAbsent');else if(loc&&/heater|calefactor|diesel|เครื่องทำความร้อน/.test(q))response=st.heaterLoc?fill(tt('heaterLocAnswer'),{where:st.heaterLoc}):tt('locationAbsent');else if(/bater|battery|charge|carga|แบต/.test(q)){response=st.mode==='demo'?tt('batteryDemo'):Number.isFinite(d?.soc)?fill(tt('batteryAnswer'),{soc:fmt(d.soc),voltage:fmt(d.voltage,2)}):tt('batteryAbsent')}else if(/solar|panel|โซลาร์|แสงอาทิตย์/.test(q)){response=st.mode==='demo'?tt('solarDemo'):Number.isFinite(d?.solarWatts)?fill(tt('solarAnswer'),{watts:fmt(d.solarWatts)}):tt('solarAbsent')}else if(/inverter|inversor|อินเวอร์เตอร์/.test(q)){response=st.mode==='demo'?tt('inverterDemo'):d?.inverter?fill(tt('inverterAnswer'),{state:tt(d.inverter==='on'?'on':'off')}):tt('inverterAbsent')}else if(/water|agua|tank|tanque|น้ำ/.test(q)){response=st.mode==='demo'?tt('waterDemo'):Number.isFinite(d?.waterPct)?fill(tt('waterAnswer'),{pct:fmt(d.waterPct)}):tt('waterAbsent')}else response=tt('unrecognised');$('reply').textContent=`${st.name}: ${response}`;$('voiceStatus').textContent='';speak(response)}
$('askBattery').onclick=()=>answer('battery');$('askSolar').onclick=()=>answer('solar');$('send').onclick=()=>{answer($('typed').value);$('typed').value=''};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});$('repeat').onclick=()=>{if(lastSpoken)speak(lastSpoken)};const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){$('listen').disabled=true;$('voiceStatus').textContent=t('noSpeech')}else $('listen').onclick=()=>{const r=new Rec();r.lang=st.speechLang;r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{$('voiceStatus').textContent=t('listening',st.speechLang.slice(0,2));$('listen').disabled=true};r.onresult=e=>{const heard=e.results[0][0].transcript;answer(heard)};r.onerror=e=>{$('voiceStatus').textContent=String(e.error)};r.onend=()=>{$('listen').disabled=false};try{r.start()}catch(e){$('listen').disabled=false;$('voiceStatus').textContent=String(e.message)}};
for(const key of ['name','brand','model','batteryLoc','heaterLoc','panels','batteryCount','endpoint','access'])$(key).value=st[key];$('mode').value=st.mode;$('speechLang').value=st.speechLang;$('reply').textContent='Charlie: '+t('ready');renderI18n();if(st.mode==='vrm'&&st.endpoint&&st.access)connect();setInterval(()=>{if(st.mode==='vrm'&&st.endpoint&&st.access&&!document.hidden)connect()},30000);
</script></body></html>
