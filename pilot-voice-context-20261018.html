<!doctype html><html lang="en-AU"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jay AI Context Pilot</title><body style="font:16px system-ui;max-width:720px;margin:auto;padding:20px;background:#092536;color:#fff"><h1>Jay AI — Context Pilot</h1><p>Experimental: no generative AI and no live Cerbo GX telemetry. No equipment controls.</p><label for="lang">Language</label><select id="lang"><option value="en-AU">English (Australia)</option><option value="es-ES">Español</option></select><p><label for="q">Question</label><input id="q" style="width:95%;padding:10px" placeholder="Where are my batteries?"></p><button id="talk">🎙️ Talk / Stop</button><button id="ask">Ask</button><button id="speak">Speak answer</button><p id="status">Ready.</p><p id="reply" aria-live="polite">Questions about equipment are answered from the profile saved in pilot-5.html on this browser.</p><h2>History (local)</h2><button id="clear">Clear history</button><ol id="history"></ol><script src="experiments/jay-ai/safari-speech-session.js"></script><script>
const $=id=>document.getElementById(id);let answer='';const key='scc-context-lab-history';
function items(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}
function draw(){const el=$('history');el.replaceChildren();for(const row of items().slice().reverse()){const li=document.createElement('li');li.textContent=row;el.append(li)}}
function ask(){const q=$('q').value.trim();if(!q)return;let p={};try{p=JSON.parse(localStorage.getItem('scc-5-pilot-profile')||'{}')}catch{}const es=$('lang').value==='es-ES',t=q.toLowerCase();if(/battery|batteries|bater/.test(t)&&/where|donde|dónde|locat|ubicac/.test(t))answer=p.batteryLoc?(es?'Ubicación registrada: ':'Recorded location: ')+p.batteryLoc:(es?'Ubicación no registrada.':'Battery location not recorded.');else if(/solar|panel/.test(t))answer=(es?'Paneles registrados: ':'Registered panels: ')+(p.solarCount||'not set');else if(/heater|diesel|calefactor/.test(t))answer=p.heaterLoc?(es?'Calefactor registrado: ':'Recorded heater: ')+p.heaterLoc:(es?'Ubicación no registrada.':'Heater location not recorded.');else answer=es?'No tengo IA generativa ni datos reales de Victron.':'No generative AI or live Victron data is connected.';$('reply').textContent=answer;try{const h=items();h.push(q.slice(0,200)+' — '+answer);localStorage.setItem(key,JSON.stringify(h.slice(-10)))}catch{}draw()}
const session=createSpeechSession(t=>{$('q').value=t;ask()},s=>$('status').textContent=s,()=>$('lang').value);
$('talk').onclick=()=>session.start();$('ask').onclick=ask;$('lang').onchange=()=>session.stop();
$('speak').onclick=()=>{if(!answer||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answer);u.lang=$('lang').value;speechSynthesis.speak(u)}catch{}};
$('clear').onclick=()=>{try{localStorage.removeItem(key)}catch{}draw()};draw();
</script></body></html>
