name: Integrated staging checks
on:
  push:
    branches: ['staging/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  staging-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python smoke tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript tests
        run: node --test experiments/vrm-fields/*.test.mjs experiments/vrm-offline/*.test.mjs tests/*.test.cjs tests/*.test.mjs
